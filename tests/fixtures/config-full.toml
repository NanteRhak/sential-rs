[general]
profile = "default"
interval = "250ms"
history_duration = "5m"
persist_history = true
data_dir = "/var/lib/sentinel"

[sampling]
cpu = true
memory = true
disk = true
network = false
temperature = true
process_io = true
process_network = false

[thresholds]
cpu_percent = 75.5
memory_percent = 80.0
temperature_celsius = 70.0
disk_usage_percent = 85.0

[alerts]
enabled = false
log_file = "/tmp/sentinel-alerts.log"

[critical_processes]
names = ["sshd", "systemd"]
